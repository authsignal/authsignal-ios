name: Publish Authsignal iOS Package

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to CocoaPods
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Deploy to CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          VERSION=$(pod ipc spec Authsignal.podspec | jq -r .version)

          published() {
            pod trunk info Authsignal | grep -F -- "- $VERSION (" > /dev/null
          }

          if published; then
            echo "Authsignal $VERSION is already on CocoaPods trunk"
            exit 0
          fi

          if pod trunk push --allow-warnings; then
            exit 0
          fi

          # Trunk sometimes returns a 500 after the version has been published
          sleep 30

          if published; then
            echo "::warning::pod trunk push failed but Authsignal $VERSION was published"
            exit 0
          fi

          exit 1
